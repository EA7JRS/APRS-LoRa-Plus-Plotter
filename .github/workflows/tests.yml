name: Pruebas y firmware

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    host:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Pruebas en el PC
              run: ./tools/run_host_tests.sh

    firmware:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - name: PlatformIO
              run: pip install platformio
            - uses: actions/cache@v4
              with:
                  path: |
                      ~/.platformio
                      .pio/libdeps
                  key: pio-${{ hashFiles('platformio.ini') }}
                  restore-keys: pio-
            # Las descargas de GitHub Releases dan 504 de vez en cuando: reintentar (como en APRS LoRa+ Display)
            - name: Compilar el firmware de la 7B
              run: |
                  ok=0
                  for i in 1 2 3 4 5; do
                      pio run -e waveshare_lcd7b && { ok=1; break; }
                      echo "intento $i fallido, reintentando en 30 s"; sleep 30
                  done
                  [ $ok = 1 ] || { echo "::error::el firmware no compila"; exit 1; }
            - uses: actions/upload-artifact@v4
              with:
                  name: firmware-waveshare_lcd7b
                  path: .pio/build/waveshare_lcd7b/firmware.bin

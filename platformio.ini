; APRS LoRa+ Plotter - plotter nautico para la Waveshare ESP32-S3-Touch-LCD-7B (7", 1024x600)
; y su accesorio APRS LoRa+ Wind, instrumento de viento para la ESP32-S3-Touch-LCD-4 (4", 480x480): env waveshare_lcd4_wind
; Copyright (C) 2026 Manuel - EA7JRS - GPL-3.0-or-later
; Misma base que APRS LoRa+ Display: pioarduino, LVGL 9.6 sin lv_conf.h, ArduinoJson.
; El nucleo (lib/plotter_core) no depende de Arduino y se prueba en el PC con tools/run_host_tests.sh.
[platformio]
default_envs = waveshare_lcd7b

[env]
; pioarduino: Arduino-ESP32 3.x (ESP-IDF 5.x), necesario para esp_lcd RGB con bounce buffer
platform = espressif32 @ 8.0.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
monitor_speed = 115200
lib_deps =
    lvgl/lvgl @ ~9.6.0
    bblanchon/ArduinoJson @ 7.4.3
    h2zero/NimBLE-Arduino @ 2.5.2
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -Isrc
    ; LVGL 9.6 sin lv_conf.h: todo por defecto salvo lo de aqui y lo de src/lv_defs.h
    -DLV_CONF_SKIP=1
    -DLV_FONT_MONTSERRAT_12=1
    -DLV_FONT_MONTSERRAT_14=1
    -DLV_FONT_MONTSERRAT_16=1
    -DLV_FONT_MONTSERRAT_20=1
    -DLV_FONT_MONTSERRAT_24=1
    -include src/lv_defs.h
    ; Carta: teselas PNG / JPEG de la tarjeta (S:), ya decodificadas en una cache de 8 MB (PSRAM)
    -DLV_USE_LODEPNG=1
    -DLV_USE_TJPGD=1
    -DLV_USE_FS_ARDUINO_SD=1
    -DLV_FS_ARDUINO_SD_LETTER=83
    -DLV_CACHE_DEF_SIZE=8388608
    -DLV_IMAGE_HEADER_CACHE_DEF_CNT=64
    -DLV_USE_LOG=0
    ; version: la misma numeracion que el resto de APRS LoRa+
    -DPLOTTER_VERSION=\"5.4.4\"

[env:waveshare_lcd7b]
; Serial = UART0 por el CH343 (el USB nativo comparte pines con el CAN)
build_src_filter = +<*> -<wind/>
build_flags =
    ${env.build_flags}
    -DBOARD_LCD7B
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; avisos oficiales por la WiFi (lib/aprs_links/alerts_net)
    -DAPRS_LINKS_ALERTS=1
    ; reloj de pixel del panel (Hz), como en APRS LoRa+ Display
    -DLCD_PCLK_HZ=18000000

[env:waveshare_lcd4_wind]
; Instrumento de viento: Waveshare ESP32-S3-Touch-LCD-4, revision V4.0 (docs/INSTRUMENTO_VIENTO.md).
; Codigo propio en src/wind; comparte con el plotter el nucleo, la placa comun y las fuentes.
; Serial = USB nativo (CDC): los GPIO43 / 44 del UART0 van al RS485 de la veleta.
build_src_filter = -<*> +<wind/> +<board_common.cpp> +<board_lcd4.cpp> +<ui_assets.cpp> +<fonts/>
build_flags =
    ${env.build_flags}
    -DBOARD_LCD4
    -Isrc/wind
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLCD_PCLK_HZ=16000000

# Version publicada: compila el firmware de la 7B y crea la release con
#   - web-site-plotter.zip  -> lo recoge el instalador web de APRS LoRa+ (grupo "Nautica"; docs/WEB_INSTALLER.md del tracker)
#   - la imagen completa (0x0) y el firmware suelto (0x10000) para grabar con esptool
# Se lanza al subir una etiqueta vX.Y.Z (la misma que la del tracker), al subir una rama release/vX.Y.Z (la etiqueta
# la crea entonces la propia release, sobre ese commit) o a mano con la etiqueta.
name: Release

on:
    push:
        tags: ["v*"]
        branches: ["release/v*"]
    workflow_dispatch:
        inputs:
            tag:
                description: "Etiqueta (vX.Y.Z)"
                required: true

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Etiqueta
              run: |
                  TAG="${{ inputs.tag || github.ref_name }}"
                  echo "TAG=${TAG#release/}" >> "$GITHUB_ENV"
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - name: Pruebas en el PC
              run: ./tools/run_host_tests.sh
            - name: La etiqueta coincide con la version del firmware
              run: |
                  V=$(grep -o 'PLOTTER_VERSION=\\"[^\\]*' platformio.ini | sed 's/.*\\"//')
                  echo "VERSION=$V" >> "$GITHUB_ENV"
                  [ "v$V" = "$TAG" ] || { echo "::error::la etiqueta $TAG no coincide con PLOTTER_VERSION $V"; exit 1; }
            - name: PlatformIO
              run: pip install platformio "esptool==4.8.1"
            - uses: actions/cache@v4
              with:
                  path: |
                      ~/.platformio
                      .pio/libdeps
                  key: pio-${{ hashFiles('platformio.ini') }}
                  restore-keys: pio-
            - name: Compilar el firmware de la 7B
              run: |
                  ok=0
                  for i in 1 2 3 4 5; do
                      pio run -e waveshare_lcd7b && { ok=1; break; }
                      echo "intento $i fallido, reintentando en 30 s"; sleep 30
                  done
                  [ $ok = 1 ] || { echo "::error::el firmware no compila"; exit 1; }
            - name: Ficheros de la version
              run: |
                  B=.pio/build/waveshare_lcd7b
                  BOOT0=$(find ~/.platformio/packages -name boot_app0.bin | head -1)
                  [ -n "$BOOT0" ] || { echo "::error::no se encuentra boot_app0.bin"; exit 1; }
                  mkdir -p out
                  python -m esptool --chip esp32s3 merge_bin -o out/aprs-lora-plus-plotter-7b-$VERSION-full.bin \
                      0x0 $B/bootloader.bin 0x8000 $B/partitions.bin 0xe000 "$BOOT0" 0x10000 $B/firmware.bin
                  cp $B/firmware.bin out/aprs-lora-plus-plotter-7b-$VERSION-firmware.bin
                  python tools/make_web_site.py --board waveshare_lcd7b --version "$VERSION" --build-dir $B --boot-app0 "$BOOT0" --out site
                  (cd site && zip -q -r ../out/web-site-plotter.zip .)
                  ls -l out
            - name: Crear o actualizar la release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  NOTES=docs/releases/$TAG.md
                  [ -f "$NOTES" ] || { echo "APRS LoRa+ Plotter $VERSION" > /tmp/notes.md; NOTES=/tmp/notes.md; }
                  if gh release view "$TAG" >/dev/null 2>&1; then
                      gh release upload "$TAG" out/* --clobber
                  else
                      gh release create "$TAG" out/* --target "$GITHUB_SHA" --title "APRS LoRa+ Plotter $VERSION" --notes-file "$NOTES" --prerelease
                  fi

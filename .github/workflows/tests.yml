name: Pruebas y firmware

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    host:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Pruebas en el PC
              run: ./tools/run_host_tests.sh

    firmware:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - name: PlatformIO
              run: pip install platformio
            - uses: actions/cache@v4
              with:
                  path: |
                      ~/.platformio
                      .pio/libdeps
                  key: pio-${{ hashFiles('platformio.ini') }}
                  restore-keys: pio-
            # Las descargas de GitHub Releases dan 504 de vez en cuando: reintentar (como en APRS LoRa+ Display)
            - name: Compilar el plotter (7B) y el instrumento de viento (LCD-4)
              run: |
                  for env in waveshare_lcd7b waveshare_lcd4_wind; do
                      ok=0
                      for i in 1 2 3 4 5; do
                          pio run -e $env && { ok=1; break; }
                          echo "intento $i fallido, reintentando en 30 s"; sleep 30
                      done
                      [ $ok = 1 ] || { echo "::error::el firmware $env no compila"; exit 1; }
                  done
            # Imagen completa (cargador, particiones y firmware) para grabar de una vez en la direccion 0x0
            - name: Imagenes completas
              run: |
                  pip install "esptool==4.8.1"
                  BOOT0=$(find ~/.platformio/packages -name boot_app0.bin | head -1)
                  [ -n "$BOOT0" ] || { echo "::error::no se encuentra boot_app0.bin"; exit 1; }
                  mkdir -p out
                  for pair in "waveshare_lcd7b aprs-lora-plus-plotter-7b" "waveshare_lcd4_wind aprs-lora-plus-wind-lcd4"; do
                      set -- $pair; B=.pio/build/$1
                      python -m esptool --chip esp32s3 merge_bin -o out/$2-full.bin \
                          0x0 $B/bootloader.bin 0x8000 $B/partitions.bin 0xe000 "$BOOT0" 0x10000 $B/firmware.bin
                      cp $B/firmware.bin out/$2-firmware.bin
                  done
                  ls -l out
            - uses: actions/upload-artifact@v4
              with:
                  name: firmware
                  path: out/*.bin

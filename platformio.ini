; APRS LoRa+ Plotter - plotter nautico para la Waveshare ESP32-S3-Touch-LCD-7B (7", 1024x600)
; Copyright (C) 2026 Manuel - EA7JRS - GPL-3.0-or-later
; Misma base que APRS LoRa+ Display: pioarduino, LVGL 9.6 sin lv_conf.h, ArduinoJson.
; El nucleo (lib/plotter_core) no depende de Arduino y se prueba en el PC con tools/run_host_tests.sh.
[platformio]
default_envs = waveshare_lcd7b

[env]
; pioarduino: Arduino-ESP32 3.x (ESP-IDF 5.x), necesario para esp_lcd RGB con bounce buffer
platform = espressif32 @ 8.0.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
monitor_speed = 115200
lib_deps =
    lvgl/lvgl @ ~9.6.0
    bblanchon/ArduinoJson @ 7.4.3
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -Isrc
    ; LVGL 9.6 sin lv_conf.h: todo por defecto salvo lo de aqui y lo de src/lv_defs.h
    -DLV_CONF_SKIP=1
    -DLV_FONT_MONTSERRAT_12=1
    -DLV_FONT_MONTSERRAT_14=1
    -DLV_FONT_MONTSERRAT_16=1
    -DLV_FONT_MONTSERRAT_20=1
    -DLV_FONT_MONTSERRAT_24=1
    -include src/lv_defs.h
    -DLV_USE_LOG=0
    ; version: la misma numeracion que el resto de APRS LoRa+
    -DPLOTTER_VERSION=\"5.4.1\"

[env:waveshare_lcd7b]
; Serial = UART0 por el CH343 (el USB nativo comparte pines con el CAN)
build_flags =
    ${env.build_flags}
    -DBOARD_LCD7B
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; reloj de pixel del panel (Hz), como en APRS LoRa+ Display
    -DLCD_PCLK_HZ=18000000
